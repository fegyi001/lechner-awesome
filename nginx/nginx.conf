load_module modules/ngx_http_headers_more_filter_module.so;
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 8192;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024; multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    proxy_cache_path /app/cache levels=1:2 keys_zone=nginx-cache:10m max_size=20m inactive=60m use_temp_path=off;

    sendfile on;
    sendfile_max_chunk 512k;
    tcp_nopush on;

    keepalive_timeout 65;
    include /etc/nginx/conf.d/*.conf;

    # https://www.cloudbees.com/blog/tuning-nginx
    # https://www.nginx.com/blog/avoiding-top-10-nginx-configuration-mistakes/
    open_file_cache max=1024 inactive=10s;
    open_file_cache_valid 120s;

    # limit_req_zone $binary_remote_addr zone=req_limit_per_ip:20m rate=100r/s;
    # limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:20m;

    # GZIP compression
    gzip on;
    gzip_types text/plain text/css text/js text/xml text/javascript application/javascript application/x-javascript application/json application/xml application/rss+xml image/svg+xml application/octet-stream;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_http_version 1.1;
    gzip_vary on;
    gzip_proxied any;
    gzip_buffers 16 8k;
    gzip_disable "MSIE [4-6] \.";

    # Brotli compression
    brotli on;
    brotli_comp_level 4;
    brotli_types text/plain text/css text/html text/xml text/javascript application/javascript application/json image/svg+xml image/x-icon font/ttf font/woff2 font/eot font/otf font/opentype application/xml+rss application/octet-stream;
    brotli_static on;
}
